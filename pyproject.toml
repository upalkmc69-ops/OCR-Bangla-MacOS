[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-bangla-macos"
version = "1.1.0"
description = "Bangla & English OCR desktop app for macOS (PDF and images to Word)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pytesseract>=0.3.13,<0.4",
    "Pillow>=10.4.0",
    "python-docx>=1.1.2",
    "lxml>=5.4.0",
    "PyMuPDF>=1.24.11",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.9"]
gui = []

[project.scripts]
ocr-bangla = "ocr_bangla:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["ocr_bangla", "ocr_engine"]

[tool.setuptools.package-data]
"*" = ["tessdata/*.traineddata"]
